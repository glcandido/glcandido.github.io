    <text x="44" y="65" fill="#c9d7e9" font-family="Arial, sans-serif" font-size="25" font-weight="700">Store performance</text>
    <g transform="translate(44 125)" font-family="Arial, sans-serif">
      <text x="0" y="38" fill="#a6b8d0" font-size="19">Astoria</text><rect x="0" y="60" width="330" height="38" rx="9" fill="#21344d"/><rect x="0" y="60" width="292" height="38" rx="9" fill="#6f4e37"/>
      <text x="0" y="150" fill="#a6b8d0" font-size="19">Hell's Kitchen</text><rect x="0" y="172" width="330" height="38" rx="9" fill="#21344d"/><rect x="0" y="172" width="318" height="38" rx="9" fill="#2f5d62"/>
      <text x="0" y="262" fill="#a6b8d0" font-size="19">Lower Manhattan</text><rect x="0" y="284" width="330" height="38" rx="9" fill="#21344d"/><rect x="0" y="284" width="284" height="38" rx="9" fill="#c58b3a"/>
    </g>
  </g>
  <g transform="translate(105 850)">
    <circle cx="25" cy="25" r="24" fill="#6f4e37"/>
    <path d="M14 17h20v13c0 8-5 13-10 13s-10-5-10-13V17zm20 4h6c6 0 9 3 9 8s-3 8-9 8h-4" fill="none" stroke="#edf4ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 12c0-4 4-5 4-9M28 12c0-4 4-5 4-9" fill="none" stroke="#c58b3a" stroke-width="3" stroke-linecap="round"/>
