<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1570 1000" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative regional bus service analysis</title>
  <desc id="desc">A stylised transport analytics cover showing passenger demand by departure and route revenue performance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123e61"/><stop offset="1" stop-color="#091629"/></linearGradient>
    <linearGradient id="trend" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#71c7ff"/><stop offset="1" stop-color="#6ee7be"/></linearGradient>
  </defs>
  <rect width="1570" height="1000" fill="url(#bg)"/>
  <text x="100" y="125" fill="#bfe6ff" font-family="Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="5">REGIONAL BUS SERVICE ANALYSIS</text>
  <text x="100" y="180" fill="#9db1ce" font-family="Arial, sans-serif" font-size="26">Demand, revenue &amp; timetable performance</text>

  <g transform="translate(100 250)">
    <rect width="845" height="570" rx="24" fill="#0b1b31" stroke="#46708f" stroke-opacity=".55"/>
    <text x="50" y="65" fill="#c9d7e9" font-family="Arial, sans-serif" font-size="25" font-weight="700">Passenger demand by departure</text>
    <g stroke="#38546f" stroke-opacity=".58" stroke-width="2"><path d="M50 150H795M50 270H795M50 390H795M50 510H795"/></g>
    <path d="M52 440 C123 408 174 450 245 383 S354 276 428 320 S540 356 612 244 S716 196 794 142" fill="none" stroke="url(#trend)" stroke-width="15" stroke-linecap="round"/>
    <path d="M52 440 C123 408 174 450 245 383 S354 276 428 320 S540 356 612 244 S716 196 794 142 V510H52Z" fill="#71c7ff" opacity=".10"/>
    <g fill="#c9d7e9" font-family="Arial, sans-serif" font-size="19"><text x="50" y="545">06:00</text><text x="195" y="545">09:00</text><text x="340" y="545">12:00</text><text x="485" y="545">15:00</text><text x="630" y="545">18:00</text><text x="755" y="545">21:00</text></g>
  </g>

  <g transform="translate(1010 250)">
    <rect width="460" height="570" rx="24" fill="#0b1b31" stroke="#46708f" stroke-opacity=".55"/>
    <text x="44" y="65" fill="#c9d7e9" font-family="Arial, sans-serif" font-size="25" font-weight="700">Route performance</text>
    <g transform="translate(44 126)" font-family="Arial, sans-serif">
      <text x="0" y="0" fill="#a6b8d0" font-size="19">Route A</text><rect x="0" y="22" width="372" height="32" rx="8" fill="#21344d"/><rect x="0" y="22" width="338" height="32" rx="8" fill="#71c7ff"/>
      <text x="0" y="116" fill="#a6b8d0" font-size="19">Route B</text><rect x="0" y="138" width="372" height="32" rx="8" fill="#21344d"/><rect x="0" y="138" width="292" height="32" rx="8" fill="#6ee7be"/>
      <text x="0" y="232" fill="#a6b8d0" font-size="19">Route C</text><rect x="0" y="254" width="372" height="32" rx="8" fill="#21344d"/><rect x="0" y="254" width="221" height="32" rx="8" fill="#4d8fc5"/>
      <line x1="0" y1="354" x2="372" y2="354" stroke="#38546f" stroke-width="2"/>
      <text x="0" y="404" fill="#a6b8d0" font-size="19">Average passengers / journey</text>
      <text x="0" y="465" fill="#bfe6ff" font-size="52" font-weight="700">55</text>
    </g>
  </g>

  <g transform="translate(105 850)">
    <circle cx="27" cy="27" r="27" fill="#2f5d62"/>
    <path d="M14 20h26v25H14zM18 25h7m4 0h7M19 45h0m16 0h0M21 20v-6h12v6" fill="none" stroke="#edf4ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="180" y="912" fill="#6ee7be" font-family="Arial, sans-serif" font-size="25" font-weight="700">SQL · Power BI · DAX · Service performance</text>
</svg>
